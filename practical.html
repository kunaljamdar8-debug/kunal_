<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprehensive HTML Example</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
background-color: #f4f4f4;
}
header, footer {
background-color: #333;
color: white;
text-align: center;
padding: 1rem 0;
}
nav ul {
list-style: none;
padding: 0;
}
nav ul li {
display: inline;
margin: 0 10px;
}
nav ul li a {
color: white;
text-decoration: none;
}
main {
padding: 20px;
}
section {
margin-bottom: 20px;
}
form {
background: white;
padding: 20px;
border-radius: 5px;
box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
form input, form textarea, form button {
display: block;
width: 100%;
margin-bottom: 10px;
padding: 10px;
border: 1px solid #ccc;
border-radius: 5px;
}
figure {
text-align: center;
}
figure img {
max-width: 100%;
height: auto;
}
figure figcaption {
margin-top: 10px;
font-style: italic;
}
</style>
</head>
<body>
<header>
<h1>Welcome to My Website</h1>
<nav>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#services">Services</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>
</header>

<main>
<section id="about">
<h2>About Us</h2>
<p>We are a team of passionate developers creating modern web solutions.</p>
</section>

<section id="services">
<h2>Our Services</h2>
<ul>
<li>Web Development</li>
<li>Mobile App Development</li>
<li>SEO Optimization</li>
</ul>
</section>

<section id="gallery">
<h2>Gallery</h2>
<figure>
<img src="https://via.placeholder.com/600x400" alt="Sample Image">
<figcaption>A beautiful placeholder image.</figcaption>
</figure>
</section>

<section id="contact">
<h2>Contact Us</h2>
<form action="/submit" method="POST">
<label for="name">Name:</label>
<input type="text" id="name" name="name" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required>

<label for="message">Message:</label>
<textarea id="message" name="message" rows="5" required></textarea>

<button type="submit">Submit</button>
</form>
</section>
</main>

<footer>
<p>© 2023 My Website. All rights reserved.</p>
</footer>
</body>
</html>
